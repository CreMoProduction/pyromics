<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Pyromics</title>
    <link rel="icon" type="image/x-icon" href="images/pyromics_256.ico">
    <link rel="stylesheet" href="//unpkg.com/docsify/themes/vue.css">
    <!-- SEO Meta Tags -->
    <meta name="description" content="Pyromics: fast and user-friendly software for processing Py-GC-MS biopolymer samples.">
    <meta name="keywords" content="Pyromics, Py-GC-MS, Multivariate Curve Resolution, MCR, Lignin, Classification, Python, Chemometrics, Documentation">
    <meta name="author" content="Alex Ilchenko">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Pyromics Documentation">
    <meta property="og:description" content="Documentation for Pyromics, a software for processing Py-GC-MS biopolymer samples.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/pyromics_256.ico">
    <meta name="robots" content="index, follow">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KZ8DKSW3FZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-KZ8DKSW3FZ');
    </script>
    <style>
      .sidebar .app-logo img,
      .app-logo img,
      .sidebar img[alt="logo"],
      img[alt="Pyromics"] {
        width: 48px !important;
        height: auto !important;
        max-width: 100% !important;
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        repo: '',
        name: 'Pyromics',
        //logo: 'images/pyromics_256.ico', // Use your custom logo file
        themeColor: '#493fb5',
        loadSidebar: true,
        loadNavbar: true,
        coverpage: '_coverpage.md', // Use your custom cover page file
        subMaxLevel: 4,
        mathjax: true,
        homepage: 'README.md',
        search: {
          placeholder: 'Type to search',
          noData: 'No results!',
          depth: 2
        },
        plugins: [
          function(hook, vm) {
            hook.beforeEach(function(html) {
              // Add footer at the bottom of each page as in the reference
              return (
                html +
                '\n\n----\n\n' +
                '<a href="https://docsify.js.org" target="_blank" style="color: inherit; font-weight: normal; text-decoration: none;">Powered by docsify. Alex Ilchenko. 2026</a>'
              );
            });

            hook.doneEach(function() {
              try {
                var content = document.querySelector('.content') || document.querySelector('.markdown-section');
                var siteName = (vm && vm.config && vm.config.name) || 'Pyromics';
                var pageTitle = siteName;
                if (content) {
                  var h1 = content.querySelector('h1, h2');
                  if (h1 && h1.textContent) pageTitle = h1.textContent.trim();
                }
                document.title = pageTitle + ' — ' + siteName;

                var desc = '';
                if (content) {
                  var p = content.querySelector('p');
                  if (p && p.textContent) desc = p.textContent.trim().slice(0, 160);
                }
                var metaDesc = document.querySelector('meta[name="description"]');
                if (!metaDesc) {
                  metaDesc = document.createElement('meta');
                  metaDesc.name = 'description';
                  document.head.appendChild(metaDesc);
                }
                metaDesc.content = desc || 'Pyromics documentation - fast Py-GC/MS processing';

                var canonical = document.querySelector('link[rel="canonical"]');
                if (!canonical) {
                  canonical = document.createElement('link');
                  canonical.rel = 'canonical';
                  document.head.appendChild(canonical);
                }
                canonical.href = location.href.split('#')[0];
              } catch (e) {
                console.warn('SEO plugin error', e);
              }
            });

          }
        ]
      }
      
      // Optional: dynamically update the browser tab title
      document.addEventListener('DOMContentLoaded', function() {
        document.title = 'Pyromics';
      });
    </script>
    <script src="//cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script src="//cdn.jsdelivr.net/npm/docsify-latex@0"></script>

    <script src="//unpkg.com/docsify/lib/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

    <!-- Adds the breadcrumb JavaScript -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/docsify-breadcrumb@latest/dist/index.min.js"></script> -->
  </body>
</html>
